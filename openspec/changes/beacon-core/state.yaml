change: beacon-core
project: pharos
created: 2026-09-02
artifact_store: hybrid (authoritative openspec per native dispatcher)
execution_mode: auto
delivery_strategy: ask-on-risk
review_budget_lines: 400
strict_tdd: true

relations:
  predecessors:
    - semantic-projection-core (Slice A, archived; frozen SemanticSource/project())
    - semantic-projection-hashing (Slice B, archived; Hasher port + JcsSha256Hasher)
  successor: fs-beacon-store (Slice D, persistence and atomic active-pointer swap)
  required_base: 582fc1f  # corrected 2026-09-02: a7c494a predated the Slice B merge; the stack builds on post-merge master

operator_decisions:
  - "No research lane (2026-09-02)"
  - "C1/C2 split inside ONE change: C1 Beacon + Draft lifecycle, C2 Version + approval + revocation + active-version resolution"
  - "Defer Clock/IdGenerator ports; ids and timestamps are caller-supplied strings"
  - "Draft.content is SemanticSource with on-demand projection/hash recomputation; no cached derived state"
  - "Stale-origin approval is a boolean gate plus explicit acknowledgment in domain; rich impact comparison deferred to a future CLI/application slice"
  - "Generic Result<T, E> lands in src/shared/ in this change"
  - "Delivery as chained PRs if the tasks forecast confirms budget risk (Slice A precedent: 3 chained PRs)"

scope_boundary:
  in: src/domain/beacon/, src/shared/, tests/domain/beacon/
  out: fs-beacon-store adapter, verification, evidence, staleness, application use cases, CLI

phases:
  explore:
    status: done
    artifacts:
      engram: sdd/beacon-core/explore (observation 2093)
    note: Read-only explorer persisted to Engram only; no openspec mirror written for this phase.
  research:
    status: skipped
    note: Offered at the pre-proposal gate; operator declined (2026-09-02).
  pre_proposal:
    status: confirmed
    artifacts:
      engram: sdd/beacon-core/pre-proposal (observation 2095)
  proposal:
    status: done
    artifacts:
      openspec: openspec/changes/beacon-core/proposal.md
      engram: sdd/beacon-core/proposal
    capabilities:
      new:
        - beacon-draft-lifecycle
        - beacon-version-lifecycle
      modified:
        - project-toolchain
    budget_note: >
      Budget risk assumed High on the Slice A precedent (~775 authored lines for a
      comparable pure-domain capability against the 400-line budget). Chained PRs
      C1 -> C2 planned, to be ratified against the exact sdd-tasks forecast.
  spec:
    status: done
    artifacts:
      openspec:
        - openspec/changes/beacon-core/specs/beacon-draft-lifecycle/spec.md
        - openspec/changes/beacon-core/specs/beacon-version-lifecycle/spec.md
        - openspec/changes/beacon-core/specs/project-toolchain/spec.md
      engram: sdd/beacon-core/spec
    capabilities:
      new:
        - beacon-draft-lifecycle
        - beacon-version-lifecycle
      modified:
        - project-toolchain
    remediation:
      amended: 2026-09-02
      reason: >
        Post-review, post-archive spec amendment. Operator review (2026-09-02,
        Engram observation 2142) confirmed 3 code blockers against ratified
        spec text and ratified 4 remediation decisions. Specs amended to
        contract-anchor the fix, not to reopen scope.
      changes:
        - "beacon-version-lifecycle: pinned the null-active stale-origin
          direction with one added scenario under Stale-Origin Approval
          Requires Explicit Acknowledgment (requirement wording was already
          correct; the implementation was not)."
        - "beacon-version-lifecycle: extended resolveActiveVersion Is a Pure
          Lookup to require the resolved record's embedded versionId to equal
          its activeVersionId lookup key, throwing on mismatch; added one
          scenario."
        - "beacon-draft-lifecycle: added a new domain-wide requirement,
          Record Lookups Use Own-Property Semantics, with two scenarios
          (createDraft, forkDraft) pinning Object.prototype-safe lookups."
        - "beacon-draft-lifecycle: replaced the abandonDraft-has-no-hash C1
          narrowing with a finalHash: string tombstone field backed by a
          Hasher parameter, aligned with docs/lifecycle-and-schema-specification-v1.md
          Abandoned drafts; updated Purpose and the abandonDraft requirement
          accordingly."
      counts:
        beacon-draft-lifecycle: { requirements: 7, scenarios: 12 }
        beacon-version-lifecycle: { requirements: 6, scenarios: 10 }
      promoted_specs_amended:
        - openspec/specs/beacon-draft-lifecycle/spec.md
        - openspec/specs/beacon-version-lifecycle/spec.md
      note: Delta (changes/) and promoted (specs/) copies verified byte-identical per capability after amendment.
  design:
    status: done
    artifacts:
      openspec: openspec/changes/beacon-core/design.md
      engram: sdd/beacon-core/design
    work_units:
      - { id: C1a, nominal_lines: 387 }
      - { id: C1b, nominal_lines: 153 }
      - { id: C1c, nominal_lines: 162 }
      - { id: C2a, nominal_lines: 387 }
      - { id: C2b, nominal_lines: 270 }
      - { id: C2c, nominal_lines: 155 }
    budget_note: >
      Nominal authored-line forecast: C1 ~702 (1.8x budget), C2 ~812 (2.0x budget).
      Both exceed the 400-line budget and MUST be chained. Forecasts are lower
      bounds: Slice A missed by 2.1x, so the calibrated band is C1 ~1120-1470 and
      C2 ~1300-1710. Expect ask-on-risk at apply for units C1a and C2a.
    remediation:
      amended: 2026-09-02
      reason: >
        Post-review design amendment following the spec amendment recorded under
        phases.spec.remediation. Operator review (Engram observation 2142)
        confirmed 3 code blockers; design.md was conformed to the amended delta
        specs so implementation has an authoritative HOW. No scope reopened.
      changes:
        - "Stale-origin gate restated as plain inequality
          `draft.origin.branchedFromVersion !== beacon.activeVersionId` (only
          equality is fresh; both null directions are stale). New ADR row 11;
          refusal-taxonomy condition line and the approval data-flow diagram
          updated. Position in the pinned approval check order is unchanged."
        - "New domain-wide convention: every caller-supplied-id lookup against a
          Record-shaped store routes through an internal `getOwn(record, key)`
          helper in src/domain/beacon/records.ts (Object.hasOwn guard). New ADR
          row 12 plus an exhaustive touch-point table covering createDraft,
          updateDraft, forkDraft (x2), abandonDraft, approveDraft (x3),
          revokeVersion, resolveActiveVersion. No new refusal token."
        - "ADR row 5 extended: resolveActiveVersion also throws when the resolved
          record's embedded versionId differs from its lookup key. New ADR row 13
          decides that revokeVersion/approveDraft do NOT get the same check,
          with rationale and rejected alternatives."
        - "Abandoned Draft variant gains `finalHash: string`; abandonDraft gains a
          Hasher parameter and records hasher.hash(project(draft.content)). ADR
          row 10 widened to cover abandonment; the prior 'C1 has no Hasher
          dependency' claim explicitly voided; new abandonment data-flow section."
        - "Work-unit table rebuilt against the landed 7-commit stack (C2a split
          into C2a-1/C2a-2) with per-unit remediation line deltas; fixes are
          woven into the original commits by rebase, not appended."
      work_unit_deltas:
        - { id: C1a, landed: 293, remediation_lines: "45-70", new_total: "338-363" }
        - { id: C1b, landed: 198, remediation_lines: "12-25", new_total: "210-223" }
        - { id: C1c, landed: 277, remediation_lines: "55-80", new_total: "332-357" }
        - { id: C2a-1, landed: 258, remediation_lines: "0-5", new_total: "258-263" }
        - { id: C2a-2, landed: 232, remediation_lines: "35-50", new_total: "267-282" }
        - { id: C2b, landed: 545, remediation_lines: "25-40", new_total: "570-585", note: "size:exception already ratified at 545; new total needs operator re-confirmation" }
        - { id: C2c, landed: 186, remediation_lines: "0", new_total: 186, note: "rebase only, no authored change" }
      remediation_total_lines: "172-270"
      budget_status: >
        Every unit except C2b remains under the 400-line budget after the
        remediation delta. C2b stays the single size:exception unit; its total
        moves from the ratified 545 to ~570-585.
  tasks:
    status: done
    artifacts:
      openspec: openspec/changes/beacon-core/tasks.md
      engram: sdd/beacon-core/tasks
    forecast:
      budget_risk: High
      chained_prs_recommended: true
      chain_strategy: pending
      decision_needed_before_apply: true
      nominal_lines: 1514
      calibrated_band: "2420-3180"
    remediation:
